<!DOCTYPE html>
<html lang = "ja">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>入会ホーム</title>
    </head>
    <body>
        <div class="container">
            <h1>入会フォーム</h1>
            <form action="" method="post">
                <div class="form-group">
                    <label for="myname">お名前<span class="required">必須</span></label>
                    <input type="text" id="myname" name="myname" placeholder="例：山田太郎" required>
                </div>
                <div class="form-group">
                    <label for="email">メールアドレス<span class="required">必須</span></label>
                    <input type="email" id="email" name="email" placeholder="例：example@example.com" required></span>
                </div>
                <div class="form-group">
                    <lacel>性別</lacel>
                    <div class="radio-group">
                        <label>
                        <input type="radio" name="gender" value="male">
                        <span>男性</span>
                        </label>
                        <label>
                        <input type="radio" name="gender" value="female">
                        <span>女性</span>
                        </label>
                        <label>
                            <input type="radio" name="gender" value="">
                            <span>その他・回答しない</span>
                        </label>
                    </div>
                </div>

                <button type="submit">送信</button>
            </form>
        </div>

    </body>
</html>
